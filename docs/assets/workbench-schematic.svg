<svg xmlns="http://www.w3.org/2000/svg" width="900" height="337" viewBox="0 0 900 337" role="img" aria-labelledby="title desc">
  <title id="title">工作台结构示意</title>
  <desc id="desc">左侧编辑协议文本，右侧查看解析出的交互结果。这是示意图，不是实际产品截图。</desc>
  <rect x=".5" y=".5" width="899" height="336" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="22" y="34" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="600">交互工作台</text>
  <text x="742" y="34" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">示意图 · 非截图</text>

  <rect x="22" y="55" width="408" height="254" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="470" y="55" width="408" height="254" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <path d="M22 97h408M470 97h408" stroke="#d0d7de"/>
  <text x="39" y="82" fill="#24292f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="600">协议文本</text>
  <text x="487" y="82" fill="#24292f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="600">交互结果</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#24292f">
    <text x="39" y="130">{@body const [n,setN]=</text>
    <text x="55" y="153">DIL.useState(0)}</text>
    <text x="39" y="192">&lt;box padding={3}&gt;</text>
    <text x="55" y="215">&lt;title&gt;Counter&lt;/title&gt;</text>
    <text x="55" y="238">&lt;text&gt;{n}&lt;/text&gt;</text>
    <text x="55" y="261">&lt;button onClick={...}&gt;</text>
    <text x="39" y="284">&lt;/box&gt;</text>
  </g>
  <path d="M438 180h24m-7-6 7 6-7 6" fill="none" stroke="#8c959f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="489" y="139" fill="#24292f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="600">Counter</text>
  <text x="489" y="177" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">当前值</text>
  <text x="565" y="177" fill="#24292f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" font-weight="600">3</text>
  <rect x="489" y="199" width="97" height="38" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="517" y="224" fill="#24292f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="600">增加</text>
  <text x="489" y="279" fill="#57606a" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">解析 → 状态 → React</text>
</svg>
