<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <title>Open Intelligent UI</title>
</head>
<body>
  <main>
    <header class="brand">
      <img src="icons/icon-32.png" width="30" height="30" alt="">
      <strong>Open Intelligent UI</strong>
    </header>
    <div class="quick-setting">
      <div><strong>启用扩展</strong><small>将有效协议回复显示为交互界面</small></div>
      <label class="toggle">
        <input id="enabled" type="checkbox" aria-label="启用扩展" disabled>
        <span class="toggle-track" aria-hidden="true"></span>
      </label>
    </div>
    <div class="page-state">
      <span>当前页面</span>
      <span id="page-status" role="status" data-tone="neutral">检测中…</span>
    </div>
    <button id="open-settings" type="button">打开设置 <span aria-hidden="true">↗</span></button>
    <p id="notice" role="status" aria-live="polite" hidden></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
