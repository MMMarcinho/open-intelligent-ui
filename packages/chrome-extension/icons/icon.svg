<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Open Intelligent UI: a folded page reveals an interactive control">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A7DDFB"/>
      <stop offset="1" stop-color="#7FC6F2"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#FFF9EB"/>
      <stop offset="1" stop-color="#F3EBD8"/>
    </linearGradient>
  </defs>

  <!-- The roomy blue field and warm paper echo the README illustration. -->
  <rect x="3" y="3" width="122" height="122" rx="28" fill="url(#sky)"/>
  <path d="M15 34c8-13 20-19 34-20M87 112c12-2 19-8 25-17" fill="none" stroke="#E2F4FC" stroke-width="2" stroke-linecap="round" opacity=".48"/>

  <!-- One sheet, with its upper corner folded into the interface panel. -->
  <path d="M29 25 73 19c2-.3 4 .4 5 1.8l22 20c1.4 1.2 2 2.7 2 4.5l2 54c.1 3-1.7 5-4.6 5.4l-68 5.4c-3.2.2-5.2-1.3-5.4-4.5L23 31c-.2-3.1 2.2-5.6 6-6Z" fill="url(#paper)" stroke="#173B5B" stroke-width="3.6" stroke-linejoin="round"/>
  <path d="m74 20 2.8 20c.3 2.2 1.6 3.4 3.8 3.2l20-2.1" fill="#E8DFCD" stroke="#173B5B" stroke-width="3.3" stroke-linejoin="round"/>
  <path d="m77 24 15 14-12 1Z" fill="#FFF9EB" opacity=".8"/>

  <!-- Loose ink strokes begin as source text. -->
  <path d="m37 49-5 5 5 4M44 52l20-2M37 66l21-1M36 76l13-.8" fill="none" stroke="#173B5B" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m48 58 15-1M36 84l12-.7" fill="none" stroke="#84AFC3" stroke-width="4.5" stroke-linecap="round"/>

  <!-- The lower part of the same sheet has become a small live control. -->
  <path d="M57 61q-.4-3.6 3.5-4l31-2.7q4-.3 4.2 3.4l2.3 32q.3 3.4-3.4 3.8l-31 2.8q-4 .4-4.3-3.2Z" fill="#FFFDF5" stroke="#173B5B" stroke-width="3.1"/>
  <path d="m66 69 22-2M67 78l22-2" fill="none" stroke="#A7C9D6" stroke-width="3.4" stroke-linecap="round"/>
  <path d="m68 87 20-1.7" fill="none" stroke="#173B5B" stroke-width="3.1" stroke-linecap="round"/>
  <circle cx="76" cy="86.2" r="6" fill="#F5B743" stroke="#173B5B" stroke-width="2.5"/>
</svg>
